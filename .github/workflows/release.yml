name: Publish Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer tag to publish, for example v1.1.0-rc.1"
        required: true
        type: string
      prerelease:
        description: "Mark this release as a prerelease"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release metadata
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          tag="$GITHUB_REF_NAME"
          prerelease=false
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_VERSION"
            prerelease="$INPUT_PRERELEASE"
          elif [[ "$tag" == *-* ]]; then
            prerelease=true
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid SemVer tag: $tag" >&2
            exit 1
          fi

          version_file=$(tr -d '\r\n' < VERSION)
          release_base="${tag#v}"
          release_base="${release_base%%-*}"
          if [[ "$version_file" != "$release_base" ]]; then
            echo "VERSION ($version_file) does not match release tag $tag" >&2
            exit 1
          fi

          repository_name="${GITHUB_REPOSITORY#*/}"
          archive_path="$RUNNER_TEMP/${repository_name}-${tag}.tar.gz"
          git archive --format=tar.gz --prefix="${repository_name}-${tag}/" --output="$archive_path" HEAD

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "make_latest=$([[ "$prerelease" == true ]] && echo false || echo true)" >> "$GITHUB_OUTPUT"
          echo "archive_path=$archive_path" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          prerelease: ${{ steps.release.outputs.prerelease }}
          make_latest: ${{ steps.release.outputs.make_latest }}
          files: ${{ steps.release.outputs.archive_path }}