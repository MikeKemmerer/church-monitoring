<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Church Monitoring</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%231a1a2e'/%3E%3Cpath d='M4 18h6l3-10 5 20 3-10h7' stroke='%2300d97e' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,system-ui,sans-serif;background:#1a1a2e;color:#e0e0e0;padding:16px}
h1{font-size:20px;margin-bottom:12px;color:#fff;display:flex;align-items:center;gap:8px}
h1 a{font-size:13px;color:#7eb8da;text-decoration:none;margin-left:auto}
h1 a:hover{text-decoration:underline}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:14px}
.card{background:#16213e;border-radius:8px;padding:14px;border:1px solid #0f3460}
.card.error{border-color:#c0392b}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.card-name{font-size:16px;font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.dot.ok{background:#27ae60}
.dot.warn{background:#f39c12}
.dot.err{background:#c0392b}
.dot.unk{background:#7f8c8d}
.card-body{display:flex;flex-direction:column;gap:8px}
.card-stats{min-width:0}
.screenshot-area{display:none;width:160px}
.screenshot-area img{width:100%;border-radius:4px;border:1px solid #0f3460;cursor:pointer}
.screenshot-area img:hover{border-color:#7eb8da}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:6px;margin-bottom:10px;font-size:12px;color:#a0a0c0}
.metrics span{background:#0f3460;border-radius:4px;padding:4px 6px;text-align:center}
.metrics .val{color:#fff;font-weight:600;display:block;font-size:14px}
.svc-list{margin-bottom:8px;font-size:13px}
.svc-row{display:flex;align-items:center;padding:3px 0;border-bottom:1px solid #0f346040}
.svc-row:last-child{border-bottom:none}
.svc-name{flex:1;min-width:0}
.svc-type{font-size:10px;color:#7f8c8d;background:#0f3460;border-radius:3px;padding:1px 5px;margin-left:6px;flex-shrink:0}
.svc-status{min-width:80px;text-align:right;margin:0 8px}
.s-active,.s-running{color:#27ae60}
.s-inactive,.s-not{color:#c0392b}
.s-unknown{color:#7f8c8d}
.actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px}
.btn-group{display:inline-flex;gap:2px;background:#0a1a35;border-radius:4px;padding:2px;flex-shrink:0}
.btn-group button{white-space:nowrap;padding:4px 6px}
button{background:#0f3460;color:#e0e0e0;border:1px solid #1a4a7a;border-radius:4px;padding:4px 10px;cursor:pointer;font-size:12px}
button:hover{background:#1a4a7a}
button:disabled{opacity:0.5;cursor:default}
.btn-restart{background:#8b4513;border-color:#a0522d;font-size:11px;padding:2px 6px}
.btn-restart:hover{background:#a0522d}
.btn-danger{background:#6b1515;border-color:#8b1010}.btn-danger:hover{background:#8b1010}
.btn-mode{background:#1a5a3a;border-color:#1e6e44}.btn-mode:hover{background:#1e6e44}
.confirm-inline{display:inline-flex;align-items:center;gap:5px;background:#1e1e1e;border:1px solid #f39c12;border-radius:4px;padding:3px 8px;font-size:11px;color:#f39c12;flex-wrap:wrap;margin-top:4px}
.confirm-inline button{padding:2px 7px;font-size:11px}
.cal-settings-grid{display:flex;gap:8px;flex-wrap:wrap}
.cal-settings-grid label{display:flex;flex-direction:column;gap:2px;font-size:11px;color:#ccc}
.cal-settings-grid select{font-size:11px;padding:2px}
.card-head-left{display:flex;align-items:center;gap:8px;min-width:0}
.menu-wrap{position:relative;flex-shrink:0}
.menu-btn{background:#0f3460;border:1px solid #1a4a7a;border-radius:4px;padding:2px 8px;font-size:15px;line-height:1;color:#e0e0e0}
.menu-btn:hover{background:#1a4a7a}
.menu-dropdown{display:none;position:absolute;left:0;top:100%;margin-top:4px;background:#0a1a35;border:1px solid #1a4a7a;border-radius:6px;padding:4px;min-width:200px;z-index:50;box-shadow:0 6px 18px rgba(0,0,0,0.5)}
.menu-dropdown.open{display:block}
.menu-item{display:block;width:100%;text-align:left;background:none;border:none;border-radius:4px;padding:7px 10px;font-size:13px;color:#e0e0e0;white-space:nowrap}
.menu-item:hover{background:#1a4a7a}
.menu-item.danger:hover{background:#8b1010}
.menu-sep{height:1px;background:#1a4a7a;margin:4px 2px;opacity:0.5}
.menu-label{font-size:10px;color:#7f8c8d;text-transform:uppercase;padding:5px 10px 2px;letter-spacing:0.5px}
.menu-sub{display:none;padding-left:10px;border-left:2px solid #1a4a7a;margin-left:6px}
.menu-sub.open{display:block}
.badge{font-size:10px;padding:1px 5px;border-radius:3px;margin-left:3px;font-weight:600;vertical-align:middle}
.badge-warn{background:#f39c12;color:#000}
.badge-err{background:#c0392b;color:#fff}
.cal-info{font-size:11px;color:#7f8c8d;margin-bottom:4px}
.cal-info-warn{font-size:11px;color:#f39c12;margin-bottom:4px}
.images-panel{display:none;margin-top:8px;background:#0f3460;border-radius:6px;padding:10px}
.images-upload{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;margin-bottom:8px}
.images-upload label{display:flex;flex-direction:column;gap:2px;font-size:11px;color:#ccc}
.img-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px}
.img-tile{background:#16213e;border-radius:6px;padding:6px;text-align:center;position:relative}
.img-tile.stale{border:1px solid #f39c12}
.img-tile img{width:100%;height:60px;object-fit:cover;border-radius:4px;cursor:pointer}
.img-noThumb{width:100%;height:60px;display:flex;align-items:center;justify-content:center;font-size:24px;background:#0a1a35;border-radius:4px}
.img-name{font-size:9px;color:#a0a0c0;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stale{font-size:11px;color:#7f8c8d;display:block;margin-top:6px}
.cec-result{font-size:12px;margin-top:6px;padding:6px;background:#0f3460;border-radius:4px;display:none}
.spinner{display:inline-block;width:12px;height:12px;border:2px solid #7f8c8d;border-top-color:#7eb8da;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-msg{text-align:center;padding:40px;color:#7f8c8d;font-size:14px}
.refresh-bar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.auto-label{font-size:11px;color:#7f8c8d}
.dev-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dev-dot.online{background:#27ae60}
.dev-dot.offline{background:#c0392b}
.dev-label{font-size:12px;color:#a0a0c0;margin-left:4px}
.dev-section{margin-top:16px}
.dev-section h2{font-size:14px;color:#7f8c8d;margin-bottom:8px}
.dev-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.dev-card{background:#16213e;border-radius:6px;padding:10px 12px;border:1px solid #0f3460;display:flex;align-items:center;justify-content:space-between}
.dev-card .card-name{font-size:14px;font-weight:600}
.dev-card a.card-name{color:#4aa3df;text-decoration:none}
.dev-card a.card-name:hover{text-decoration:underline}
.ext-icon{font-size:11px;opacity:.7}
.user-bar{display:flex;align-items:center;gap:10px;font-size:12px;color:#a0a0c0;margin-left:auto}
.user-bar .role-badge{background:#0f3460;border-radius:4px;padding:2px 7px;font-size:11px;text-transform:capitalize}
.user-bar a, .user-bar button.link-btn{color:#7eb8da;text-decoration:none;background:none;border:none;padding:0;font-size:12px;cursor:pointer}
.user-bar a:hover, .user-bar button.link-btn:hover{text-decoration:underline}
.auth-panel{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:50;align-items:center;justify-content:center}
.auth-panel.open{display:flex}
.auth-panel-inner{background:#16213e;border:1px solid #0f3460;border-radius:8px;padding:18px;min-width:280px;max-width:90vw;max-height:85vh;overflow:auto}
.auth-panel-inner h2{font-size:15px;margin-bottom:10px}
.auth-panel-inner label{display:block;font-size:11px;color:#ccc;margin-top:8px}
.auth-panel-inner input{width:100%;margin-top:3px;padding:5px;border-radius:4px;border:1px solid #0f3460;background:#0a1a35;color:#e0e0e0}
.auth-panel-actions{margin-top:12px;display:flex;gap:8px;justify-content:flex-end}
.users-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
.users-table th,.users-table td{text-align:left;padding:5px 8px;border-bottom:1px solid #0f3460}
.users-table td.actions-cell{display:flex;gap:4px;flex-wrap:wrap}
.badge-locked{background:#c0392b;border-radius:4px;padding:1px 6px;font-size:10px}
.add-user-form{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-top:10px}
.add-user-form label{display:flex;flex-direction:column;gap:2px;font-size:11px;color:#ccc}
.add-user-form input,.add-user-form select{padding:5px;border-radius:4px;border:1px solid #0f3460;background:#0a1a35;color:#e0e0e0}
@media(max-width:500px){
.cards{grid-template-columns:1fr}
.screenshot-area{width:100%}
.metrics{grid-template-columns:repeat(2,1fr)}
.actions{gap:4px}
button{padding:4px 8px;font-size:11px}
}
</style>
</head>
<body>

<h1>&#128225; Church Monitoring <span class="user-bar" id="userBar"></span> <a href="help.html">Help</a></h1>

<div class="auth-panel" id="changePasswordPanel">
    <div class="auth-panel-inner">
        <h2>Change Password</h2>
        <div id="changePasswordError" class="stale"></div>
        <label>Current password<input type="password" id="cpCurrent"></label>
        <label>New password (min 8 characters)<input type="password" id="cpNew"></label>
        <label>Confirm new password<input type="password" id="cpConfirm"></label>
        <div class="auth-panel-actions">
            <button onclick="closeChangePasswordPanel()">Cancel</button>
            <button onclick="submitChangePassword()">Change Password</button>
        </div>
    </div>
</div>

<div class="auth-panel" id="manageUsersPanel">
    <div class="auth-panel-inner" style="min-width:520px">
        <h2>Manage Users</h2>
        <div id="manageUsersBody">Loading&hellip;</div>
        <div class="auth-panel-actions">
            <button onclick="closeManageUsersPanel()">Close</button>
        </div>
    </div>
</div>

<div class="refresh-bar">
    <button onclick="fetchAll(true)">&#x21bb; Refresh All</button>
    <label class="auto-label"><input type="checkbox" id="autoRefresh" checked> Auto-refresh 60s</label>
    <span class="stale" id="lastUpdate"></span>
</div>

<div class="cards" id="cards">
    <div class="loading-msg"><span class="spinner"></span> Loading status&hellip;</div>
</div>

<div class="dev-section" id="devSection" style="display:none">
    <h2>Devices</h2>
    <div class="dev-cards" id="devCards"></div>
</div>

<script>
var autoTimer = null;
var cecCache = {};  // Persistent CEC results keyed by client name
var cecTimerInterval = null;
var CURRENT_USER = null;
var ROLE_RANK = {user: 1, contributor: 2, admin: 3};

function hasRole(min) {
    return !!CURRENT_USER && (ROLE_RANK[CURRENT_USER.role] || 0) >= (ROLE_RANK[min] || 99);
}

function checkAuth() {
    return fetch('/cgi-bin/whoami.cgi', {credentials: 'same-origin'})
        .then(function(r) {
            if (!r.ok) {
                window.location.href = 'login.html';
                return Promise.reject(new Error('not logged in'));
            }
            return r.json();
        })
        .then(function(data) {
            CURRENT_USER = data;
            renderUserBar();
        });
}

function renderUserBar() {
    var bar = document.getElementById('userBar');
    if (!bar || !CURRENT_USER) return;
    var html = escapeHtml(CURRENT_USER.username) + ' <span class="role-badge">' + escapeHtml(CURRENT_USER.role) + '</span>';
    html += ' <button class="link-btn" onclick="openChangePasswordPanel()">Change Password</button>';
    if (hasRole('admin')) {
        html += ' <button class="link-btn" onclick="openManageUsersPanel()">Manage Users</button>';
    }
    html += ' <a href="#" onclick="doLogout();return false;">Logout</a>';
    bar.innerHTML = html;
}

function doLogout() {
    fetch('/cgi-bin/logout.cgi', {credentials: 'same-origin'}).finally(function() {
        window.location.href = 'login.html';
    });
}

function openChangePasswordPanel() {
    document.getElementById('cpCurrent').value = '';
    document.getElementById('cpNew').value = '';
    document.getElementById('cpConfirm').value = '';
    document.getElementById('changePasswordError').textContent = '';
    document.getElementById('changePasswordPanel').classList.add('open');
}

function closeChangePasswordPanel() {
    document.getElementById('changePasswordPanel').classList.remove('open');
}

function submitChangePassword() {
    var current = document.getElementById('cpCurrent').value;
    var next = document.getElementById('cpNew').value;
    var confirmVal = document.getElementById('cpConfirm').value;
    var errEl = document.getElementById('changePasswordError');
    errEl.textContent = '';

    if (!current || !next) { errEl.textContent = 'All fields are required.'; return; }
    if (next.length < 8) { errEl.textContent = 'New password must be at least 8 characters.'; return; }
    if (next !== confirmVal) { errEl.textContent = 'New password and confirmation do not match.'; return; }

    fetch('/cgi-bin/change-password.cgi', {
        method: 'POST',
        credentials: 'same-origin',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({current_password: current, new_password: next})
    })
        .then(function(r) { return r.json(); })
        .then(function(data) {
            if (data.error) { errEl.textContent = data.error; return; }
            closeChangePasswordPanel();
            alert('Password changed.');
        })
        .catch(function(err) { errEl.textContent = 'Failed: ' + err; });
}

function openManageUsersPanel() {
    document.getElementById('manageUsersPanel').classList.add('open');
    loadManageUsersPanel();
}

function closeManageUsersPanel() {
    document.getElementById('manageUsersPanel').classList.remove('open');
}

function loadManageUsersPanel() {
    var body = document.getElementById('manageUsersBody');
    body.innerHTML = '<span class="spinner"></span> Loading&hellip;';
    fetch('/cgi-bin/users.cgi?action=list', {credentials: 'same-origin'})
        .then(function(r) { return r.json(); })
        .then(function(data) {
            if (data.error) { body.innerHTML = '<small>&#9888; ' + escapeHtml(data.error) + '</small>'; return; }
            renderManageUsers(data.users || []);
        })
        .catch(function(err) { body.innerHTML = '<small>&#9888; Failed to load: ' + escapeHtml(String(err)) + '</small>'; });
}

function usersAction(action, payload) {
    return fetch('/cgi-bin/users.cgi?action=' + encodeURIComponent(action), {
        method: 'POST',
        credentials: 'same-origin',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload || {})
    }).then(function(r) { return r.json(); });
}

function renderManageUsers(users) {
    var body = document.getElementById('manageUsersBody');
    var html = '<table class="users-table"><thead><tr><th>Username</th><th>Role</th><th>Status</th><th>Last Login</th><th>Actions</th></tr></thead><tbody>';
    users.forEach(function(u) {
        html += '<tr>';
        html += '<td>' + escapeHtml(u.username) + '</td>';
        html += '<td>' + escapeHtml(u.role) + '</td>';
        html += '<td>' + (u.locked ? '<span class="badge-locked">locked</span>' : 'active') +
            (u.failed_attempts > 0 ? ' <small class="stale">(' + u.failed_attempts + ' failed)</small>' : '') + '</td>';
        html += '<td><small class="stale">' + escapeHtml(u.last_login || 'never') + '</small></td>';
        html += '<td class="actions-cell">';
        html += '<button onclick="userSetRole(\'' + escapeAttr(u.username) + '\')">Set Role</button>';
        html += '<button onclick="userResetPassword(\'' + escapeAttr(u.username) + '\')">Reset Password</button>';
        if (u.locked) {
            html += '<button onclick="userUnlock(\'' + escapeAttr(u.username) + '\')">Unlock</button>';
        } else {
            html += '<button onclick="userLock(\'' + escapeAttr(u.username) + '\')">Lock</button>';
        }
        html += '<button class="btn-danger" onclick="userRemove(\'' + escapeAttr(u.username) + '\')">Remove</button>';
        html += '</td></tr>';
    });
    html += '</tbody></table>';
    html += '<div class="add-user-form">';
    html += '<label>Username<input type="text" id="newUserName"></label>';
    html += '<label>Password<input type="password" id="newUserPass"></label>';
    html += '<label>Role<select id="newUserRole"><option value="user">user</option><option value="contributor">contributor</option><option value="admin">admin</option></select></label>';
    html += '<button onclick="userAdd()">Add User</button>';
    html += '</div>';
    html += '<div id="manageUsersError" class="stale"></div>';
    body.innerHTML = html;
}

function userAdd() {
    var username = document.getElementById('newUserName').value.trim();
    var password = document.getElementById('newUserPass').value;
    var role = document.getElementById('newUserRole').value;
    usersAction('add', {username: username, password: password, role: role}).then(function(data) {
        var errEl = document.getElementById('manageUsersError');
        if (data.error) { errEl.textContent = data.error; return; }
        loadManageUsersPanel();
    });
}

function userSetRole(username) {
    var role = prompt('New role for ' + username + ' (user, contributor, admin):');
    if (!role) return;
    usersAction('set-role', {username: username, role: role.trim()}).then(function(data) {
        if (data.error) { alert(data.error); return; }
        loadManageUsersPanel();
    });
}

function userResetPassword(username) {
    var pass = prompt('New password for ' + username + ' (min 8 characters):');
    if (!pass) return;
    usersAction('set-password', {username: username, new_password: pass}).then(function(data) {
        if (data.error) { alert(data.error); return; }
        loadManageUsersPanel();
    });
}

function userLock(username) {
    if (!confirm('Lock account "' + username + '"?')) return;
    usersAction('lock', {username: username}).then(function(data) {
        if (data.error) { alert(data.error); return; }
        loadManageUsersPanel();
    });
}

function userUnlock(username) {
    usersAction('unlock', {username: username}).then(function(data) {
        if (data.error) { alert(data.error); return; }
        loadManageUsersPanel();
    });
}

function userRemove(username) {
    if (!confirm('Remove account "' + username + '"? This cannot be undone.')) return;
    usersAction('remove', {username: username}).then(function(data) {
        if (data.error) { alert(data.error); return; }
        loadManageUsersPanel();
    });
}

function formatUptime(s) {
    if (!s && s !== 0) return '—';
    var d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600),
        m = Math.floor((s % 3600) / 60);
    var parts = [];
    if (d) parts.push(d + 'd');
    if (h) parts.push(h + 'h');
    parts.push(m + 'm');
    return parts.join(' ');
}

function ago(ts) {
    if (!ts) return 'never';
    var diff = Math.floor((Date.now() - new Date(ts).getTime()) / 1000);
    if (diff < 60) return diff + 's ago';
    if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
    return Math.floor(diff / 3600) + 'h ago';
}

function statusClass(s) {
    if (!s) return 's-unknown';
    if (s === 'active' || s.indexOf('running') === 0) return 's-active';
    if (s === 'ok') return 's-active';
    if (s === 'fail') return 's-inactive';
    if (s === 'inactive' || s === 'not running') return 's-inactive';
    return 's-unknown';
}

function hostHealth(data) {
    if (data.error) return 'err';
    var svcs = data.services || [];
    var bad = false;

    // Identify mutual-exclusion pair: vlc and the failover browser.
    // Legacy clients report that browser as "midori".
    var vlcSvc = null, browserSvc = null;
    svcs.forEach(function(svc) {
        if (svc.name === 'vlc') vlcSvc = svc;
        if (svc.name === 'browser' || svc.name === 'midori') browserSvc = svc;
    });

    var vlcUp = vlcSvc && vlcSvc.status && vlcSvc.status.indexOf('running') === 0;
    var browserUp = browserSvc && browserSvc.status && browserSvc.status.indexOf('running') === 0;
    var hasPair = vlcSvc && browserSvc;

    // Both running = caution
    if (hasPair && vlcUp && browserUp) return 'warn';

    // Check all services, but skip the expected-down member of the pair
    svcs.forEach(function(svc) {
        if (svc.status === 'inactive' || svc.status === 'not running') {
            // If this is the idle member of the VLC/browser pair, it is expected.
            if (hasPair && ((svc === browserSvc && vlcUp) || (svc === vlcSvc && browserUp))) return;
            bad = true;
        }
    });

    // Neither running when both are monitored = bad
    if (hasPair && !vlcUp && !browserUp) bad = true;

    return bad ? 'warn' : 'ok';
}

function renderMenu(name, data) {
    var n = escapeAttr(name);
    var m = '<div class="menu-wrap">';
    m += '<button class="menu-btn" title="Actions" onclick="toggleMenu(event,\'' + n + '\')">&#9776;</button>';
    m += '<div class="menu-dropdown" id="menu-' + n + '">';

    // Backup actions
    m += '<div class="menu-label">Backup</div>';
    if (hasRole('contributor')) {
        m += '<button class="menu-item" onclick="backup(\'' + n + '\')">&#128190; Create backup</button>';
    }
    m += '<button class="menu-item" onclick="downloadBackup(\'' + n + '\')">&#11015; Download latest backup</button>';

    // Restart entries for each monitored systemd service
    var systemd = (data.services || []).filter(function(svc) { return svc.type === 'systemd'; });
    if (systemd.length && hasRole('contributor')) {
        m += '<div class="menu-sep"></div><div class="menu-label">Restart service</div>';
        systemd.forEach(function(svc) {
            m += '<button class="menu-item" onclick="restartServiceMenu(\'' + n + '\',\'' + escapeAttr(svc.name) + '\')">&#x21bb; ' + escapeHtml(svc.name) + '</button>';
        });
    }

    // CEC submenu (if enabled on this client) — status check is read-only and
    // available to everyone; the control actions require contributor.
    if (data.cec_enabled) {
        m += '<div class="menu-sep"></div>';
        m += '<button class="menu-item" onclick="toggleSub(event,\'' + n + '\')">&#128250; TV (CEC) &#9656;</button>';
        m += '<div class="menu-sub" id="sub-' + n + '">';
        m += '<button class="menu-item" onclick="checkCecMenu(\'' + n + '\')">Check status</button>';
        if (hasRole('contributor')) {
            m += '<button class="menu-item" onclick="cecControlMenu(\'' + n + '\',\'on\')">&#9654; Power on</button>';
            m += '<button class="menu-item" onclick="cecControlMenu(\'' + n + '\',\'standby\')">&#9724; Standby</button>';
            m += '<button class="menu-item" onclick="cecControlMenu(\'' + n + '\',\'active\')">&#127909; Active input</button>';
        }
        m += '</div>';
    }

    // Reboot (destructive)
    if (hasRole('contributor')) {
        m += '<div class="menu-sep"></div>';
        m += '<button class="menu-item danger" onclick="rebootHostMenu(\'' + n + '\')">&#x23FB; Reboot host</button>';
    }

    m += '</div></div>';
    return m;
}

function renderCard(data) {
    var name = data.client_name || data.hostname || 'unknown';
    var health = hostHealth(data);

    if (data.error && !data.services) {
        return '<div class="card error"><div class="card-head"><span class="card-name">' +
            name + '</span><span class="dot err"></span></div>' +
            '<div style="color:#c0392b;font-size:13px;">' + escapeHtml(data.error) + '</div></div>';
    }

    var html = '<div class="card"><div class="card-head"><div class="card-head-left">' +
        renderMenu(name, data) +
        '<span class="card-name">' + escapeHtml(name) + '</span></div><span class="dot ' + health + '"></span></div>';

    html += '<div class="card-body">';

    // Screenshot area (above stats, shown when captured)
    html += '<div class="screenshot-area" id="screen-' + escapeAttr(name) + '"></div>';

    // Stats
    html += '<div class="card-stats">';

    // Metrics
    html += '<div class="metrics">';
    html += '<span>Uptime<span class="val">' + formatUptime(data.uptime_seconds) + '</span></span>';
    if (data.load) html += '<span>CPU Load<span class="val">' + data.load.avg_1 + '</span></span>';
    if (data.memory) html += '<span>Memory<span class="val">' + data.memory.used_mb + '/' + data.memory.total_mb + ' MB</span></span>';
    if (data.disk) {
        var diskPct = data.disk.pct != null ? parseFloat(data.disk.pct) : 0;
        var diskStyle = diskPct >= 95 ? ' style="color:#c0392b"' : diskPct >= 85 ? ' style="color:#f39c12"' : '';
        html += '<span>Disk<span class="val"' + diskStyle + '>' +
            Math.round(data.disk.used_mb / 1024 * 10) / 10 + '/' +
            Math.round(data.disk.total_mb / 1024 * 10) / 10 + ' GB' +
            (diskPct ? '<small style="font-size:10px;margin-left:2px">(' + diskPct + '%)</small>' : '') +
            '</span></span>';
    }
    if (data.temperature_c !== null && data.temperature_c !== undefined) {
        var tempC = parseFloat(data.temperature_c);
        var tempStyle = tempC >= 80 ? ' style="color:#c0392b"' : tempC >= 70 ? ' style="color:#f39c12"' : '';
        var thrBadge = '';
        if (data.throttle_hex && data.throttle_hex !== '0x0') {
            var tval = parseInt(data.throttle_hex, 16);
            if (tval & 0xf) thrBadge = ' <span class="badge badge-err" title="' + escapeHtml(data.throttle_hex) + '">THR</span>';
            else if (tval & 0xf0000) thrBadge = ' <span class="badge badge-warn" title="' + escapeHtml(data.throttle_hex) + '">THR\u2605</span>';
        }
        html += '<span>Temp<span class="val"' + tempStyle + '>' + data.temperature_c + '&deg;C' + thrBadge + '</span></span>';
    }
    html += '</div>';

    // HDMI state, cert expiry, and calendar images info rows
    var infoRow = [];
    if (data.hdmi) {
        var hdmiCol = data.hdmi === 'connected' ? '#27ae60' : (data.hdmi === 'unknown' ? '#7f8c8d' : '#c0392b');
        var hdmiTip = '';
        if (data.hdmi_source || data.hdmi_raw) {
            hdmiTip = 'Detection source: ' + (data.hdmi_source || 'n/a');
            if (data.hdmi_raw) {
                var details = String(data.hdmi_raw).replace(/;/g, '\n');
                hdmiTip += '\nConnectors:\n' + details;
            }
        }
        infoRow.push('<span' + (hdmiTip ? ' title="' + escapeHtml(hdmiTip) + '"' : '') + '>HDMI: <b style="color:' + hdmiCol + '">' + escapeHtml(data.hdmi) + '</b></span>');
    }
    (data.slow_metrics || []).forEach(function(m) {
        if (m.status === 'unavailable') return;
        var col = m.status === 'error' ? '#c0392b' : m.status === 'warn' ? '#f39c12' : '#7f8c8d';
        infoRow.push('<span style="color:' + col + '" title="' + escapeHtml(m.tooltip || '') + '">' + escapeHtml(m.label) + ': ' + escapeHtml(m.value) + '</span>');
    });
    if (infoRow.length) {
        html += '<div style="font-size:11px;display:flex;gap:12px;margin-bottom:5px;">' + infoRow.join('') + '</div>';
    }
    if (data.calendar_images) {
        var ci = data.calendar_images;
        html += '<div class="' + (ci.stale > 0 ? 'cal-info-warn' : 'cal-info') + '">';
        html += '&#128444; Cal images: <b>' + ci.total + '</b>';
        if (ci.stale > 0) html += ' &mdash; <span class="badge badge-warn">' + ci.stale + ' stale</span>';
        html += '</div>';
    }

    // Services list (flex rows instead of table)
    if (data.services && data.services.length) {
        html += '<div class="svc-list">';
        data.services.forEach(function(svc) {
            var detailHtml = '';
            if (svc.detail) {
                detailHtml = '<div class="svc-type" style="margin-top:2px;max-width:100%;overflow-wrap:anywhere;">' + escapeHtml(svc.detail) + '</div>';
            }
            html += '<div class="svc-row"><span class="svc-name">' + escapeHtml(svc.name) +
                '<span class="svc-type">' + svc.type + '</span>' + detailHtml + '</span>' +
                '<span class="svc-status ' + statusClass(svc.status) + '">' + escapeHtml(svc.status) + '</span>';
            html += '</div>';
        });
        html += '</div>';
    }

    // Actions
    html += '<div class="actions">';
    html += '<button onclick="refreshOne(\'' + escapeAttr(name) + '\')">&#x21bb; Refresh</button>';
    html += '<button onclick="captureScreen(\'' + escapeAttr(name) + '\')">📷 Screenshot</button>';
    // Mode switch (show if kiosk processes are monitored)
    var hasVlc = false, hasBrowser = false, hasMidori = false;
    (data.services || []).forEach(function(svc) {
        if (svc.name === 'vlc') hasVlc = true;
        if (svc.name === 'browser') hasBrowser = true;
        if (svc.name === 'midori') hasMidori = true;
    });
    if (hasVlc || hasBrowser || hasMidori) {
        html += '<span class="btn-group">';
        if (hasRole('contributor')) {
            html += '<button class="btn-mode" onclick="modeSwitch(\'' + escapeAttr(name) + '\',\'vlc\',this)">&#9654; VLC</button>';
            html += '<button class="btn-mode" onclick="modeSwitch(\'' + escapeAttr(name) + '\',\'browser\',this)">&#127760; Browser</button>';
        }
        html += '</span>';
    }
    if ((hasBrowser || hasMidori) && hasRole('contributor')) {
        html += '<button onclick="toggleCalendarPanel(\'' + escapeAttr(name) + '\',this)">&#127912; Calendar</button>';
    }
    if (data.calendar_images) {
        html += '<button onclick="toggleImagesPanel(\'' + escapeAttr(name) + '\',this)">&#128444; Manage Images' +
            (data.calendar_images.stale > 0 ? ' <span class="badge badge-warn">' + data.calendar_images.stale + '</span>' : '') +
            '</button>';
    }
    html += '</div>';
    html += '<span class="stale">Cached ' + ago(data.timestamp) + '</span>';

    // CEC result area
    if (data.cec_enabled) {
        var cached = cecCache[name];
        var cecDisplay = cached ? 'display:block' : 'display:none';
        var cecContent = cached ? renderCecResult(cached) : '';
        html += '<div class="cec-result" id="cec-' + escapeAttr(name) + '" style="' + cecDisplay + '">' + cecContent + '</div>';
    }

    // Calendar images management panel (populated on demand)
    if (data.calendar_images) {
        html += '<div class="images-panel" id="images-panel-' + safeId(name) + '"></div>';
    }

    html += '</div>'; // card-stats

    html += '</div>'; // card-body
    html += '</div>'; // card
    return html;
}

function escapeHtml(s) {
    if (!s) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function escapeAttr(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,"\\'");
}

function safeId(s) {
    return String(s).replace(/[^a-zA-Z0-9]/g, '-');
}

function renderCecResult(cached) {
    var power = cached.tv_power || 'unknown';
    var input = cached.hdmi_input || 'unknown';
    var color = power === 'on' ? '#27ae60' : power === 'standby' ? '#f39c12' : '#7f8c8d';
    return '<span style="color:' + color + '">&#9679;</span> TV: <b>' + escapeHtml(power) +
        '</b> &nbsp; HDMI: <b>' + escapeHtml(input) + '</b> &nbsp; ' +
        '<span class="cec-ago" data-ts="' + cached.fetchedAt + '">' + ago(new Date(cached.fetchedAt).toISOString()) + '</span>';
}

function updateCecTimers() {
    var els = document.querySelectorAll('.cec-ago');
    els.forEach(function(el) {
        var ts = parseInt(el.getAttribute('data-ts'), 10);
        if (!ts) return;
        var diff = Math.floor((Date.now() - ts) / 1000);
        if (diff < 60) el.textContent = diff + 's ago';
        else if (diff < 3600) el.textContent = Math.floor(diff / 60) + 'm ' + (diff % 60) + 's ago';
        else el.textContent = Math.floor(diff / 3600) + 'h ' + Math.floor((diff % 3600) / 60) + 'm ago';
    });
}

function fetchAll(force) {
    var cards = document.getElementById('cards');
    var url = '/cgi-bin/fetch-status.cgi';
    if (force) url += '?refresh=1';
    fetch(url)
        .then(function(r) { return r.json(); })
        .then(function(data) {
            if (!Array.isArray(data)) {
                cards.innerHTML = '<div class="loading-msg" style="color:#c0392b;">Error: ' + escapeHtml(data.error || 'unexpected response') + '</div>';
                return;
            }
            if (data.length === 0) {
                cards.innerHTML = '<div class="loading-msg">No clients enrolled yet.<br><br>Run <code>sudo ./install-client.sh</code> on a host to add it.</div>';
                return;
            }
            var html = '';
            data.forEach(function(d) { html += renderCard(d); });
            cards.innerHTML = html;
            document.getElementById('lastUpdate').textContent = 'Updated ' + new Date().toLocaleTimeString();
            fetchDeviceStatus();
        })
        .catch(function(err) {
            cards.innerHTML = '<div class="loading-msg" style="color:#c0392b;">Failed to fetch status: ' + escapeHtml(String(err)) + '</div>';
        });
}

function fetchDeviceStatus() {
    fetch('/cgi-bin/device-status.cgi')
        .then(function(r) { return r.json(); })
        .then(function(ds) {
            if (!ds || ds.error) return;
            var keys = Object.keys(ds);
            if (keys.length === 0) return;
            var section = document.getElementById('devSection');
            var container = document.getElementById('devCards');
            var html = '';
            keys.forEach(function(name) {
                var entry = ds[name];
                var status = (entry && typeof entry === 'object') ? entry.status : entry;
                var url = (entry && typeof entry === 'object') ? entry.url : '';
                var dotClass = status === 'online' ? 'online' : 'offline';
                var nameHtml = url ?
                    '<a class="card-name" href="' + escapeAttr(url) + '" target="_blank" rel="noopener noreferrer">' +
                        escapeHtml(name) + ' <span class="ext-icon">&#8599;</span></a>' :
                    '<span class="card-name">' + escapeHtml(name) + '</span>';
                html += '<div class="dev-card">' +
                    nameHtml +
                    '<span><span class="dev-dot ' + dotClass + '" id="dev-dot-' + escapeAttr(name) + '"></span>' +
                    '<button style="margin-left:6px;padding:2px 6px;font-size:11px" onclick="refreshDevice(\'' + escapeAttr(name) + '\')">' +
                    '&#x21bb;</button></span></div>';
            });
            container.innerHTML = html;
            section.style.display = '';
        })
        .catch(function() { /* device-status is optional */ });
}

function refreshDevice(name) {
    var dot = document.getElementById('dev-dot-' + name);
    if (dot) { dot.className = 'dev-dot'; dot.style.background = '#7f8c8d'; }
    fetch('/cgi-bin/device-status.cgi?refresh=1')
        .then(function(r) { return r.json(); })
        .then(function(ds) {
            if (!ds || ds.error) return;
            for (var k in ds) {
                var entry = ds[k];
                var st = (entry && typeof entry === 'object') ? entry.status : entry;
                var el = document.getElementById('dev-dot-' + k);
                if (el) {
                    el.className = 'dev-dot ' + (st === 'online' ? 'online' : 'offline');
                    el.style.background = '';
                }
            }
        })
        .catch(function() {
            if (dot) { dot.className = 'dev-dot offline'; dot.style.background = ''; }
        });
}

function refreshOne(name) {
    // Currently re-fetches all — could be optimized to single-client endpoint
    fetchAll();
}

function checkCec(name) {
    var el = document.getElementById('cec-' + name);
    if (!el) return;
    el.style.display = 'block';
    el.innerHTML = '<span class="spinner"></span> Querying CEC (may take a few seconds)&hellip;';

    fetch('/cgi-bin/fetch-cec.cgi?host=' + encodeURIComponent(name))
        .then(function(r) { return r.json(); })
        .then(function(data) {
            if (data.error) {
                el.innerHTML = '&#9888; ' + escapeHtml(data.error);
                delete cecCache[name];
                return;
            }
            data.fetchedAt = Date.now();
            cecCache[name] = data;
            el.innerHTML = renderCecResult(data);
        })
        .catch(function(err) {
            el.innerHTML = '&#9888; CEC check failed: ' + escapeHtml(String(err));
            delete cecCache[name];
        });
}

function cecControl(name, action) {
    var el = document.getElementById('cec-' + name);
    if (!el) return;
    el.style.display = 'block';
    var labels = {on:'Turning TV on',standby:'Putting TV in standby',active:'Setting active input'};
    el.innerHTML = '<span class="spinner"></span> ' + (labels[action] || action) + '&hellip;';

    fetch('/cgi-bin/cec-control.cgi?host=' + encodeURIComponent(name) + '&action=' + encodeURIComponent(action))
        .then(function(r) { return r.json(); })
        .then(function(data) {
            if (data.error) {
                el.innerHTML = '&#9888; ' + escapeHtml(data.error);
                return;
            }
            var color = data.result === 'on' ? '#27ae60' : data.result === 'standby' ? '#f39c12' : '#7eb8da';
            el.innerHTML = '<span style="color:' + color + '">&#9679;</span> ' +
                escapeHtml(action) + ': <b>' + escapeHtml(data.result) + '</b> &nbsp; ' +
                '<span class="cec-ago" data-ts="' + Date.now() + '">0s ago</span>';
        })
        .catch(function(err) {
            el.innerHTML = '&#9888; CEC control failed: ' + escapeHtml(String(err));
        });
}

function captureScreen(name) {
    var el = document.getElementById('screen-' + name);
    if (!el) return;
    el.style.display = 'block';
    el.innerHTML = '<span class="spinner"></span>';

    fetch('/cgi-bin/fetch-screenshot.cgi?host=' + encodeURIComponent(name))
        .then(function(r) {
            var ct = r.headers.get('Content-Type') || '';
            if (ct.indexOf('image/') === 0) {
                return r.blob().then(function(blob) {
                    var url = URL.createObjectURL(blob);
                    el.innerHTML = '<img src="' + url + '" alt="Screenshot" onclick="window.open(this.src)">';
                });
            }
            return r.json().then(function(data) {
                el.innerHTML = '<small>&#9888; ' + escapeHtml(data.error || 'Error') + '</small>';
            });
        })
        .catch(function(err) {
            el.innerHTML = '<small>&#9888; Failed</small>';
        });
}

function toggleMenu(ev, name) {
    ev.stopPropagation();
    var menu = document.getElementById('menu-' + name);
    if (!menu) return;
    var wasOpen = menu.classList.contains('open');
    closeMenus();
    if (!wasOpen) menu.classList.add('open');
}

function toggleSub(ev, name) {
    ev.stopPropagation();
    var sub = document.getElementById('sub-' + name);
    if (sub) sub.classList.toggle('open');
}

function closeMenus() {
    var opens = document.querySelectorAll('.menu-dropdown.open, .menu-sub.open');
    for (var i = 0; i < opens.length; i++) opens[i].classList.remove('open');
}
document.addEventListener('click', closeMenus);

// Menu wrappers: close the dropdown, then run the existing action.
function restartServiceMenu(host, service) { closeMenus(); restartService(host, service); }
function checkCecMenu(host) { closeMenus(); checkCec(host); }
function cecControlMenu(host, action) { closeMenus(); cecControl(host, action); }
function rebootHostMenu(host) {
    closeMenus();
    if (!confirm('Reboot ' + host + '? The host will be unavailable for ~20s.')) return;
    doReboot(host);
}

function backup(host) {
    closeMenus();
    if (!confirm('Create a configuration backup on ' + host + '?')) return;
    fetchJson('/cgi-bin/backup.cgi?host=' + encodeURIComponent(host))
        .then(function(data) {
            if (data.error || data.ok === false) {
                alert('Backup failed: ' + (data.error || 'unknown error'));
                return;
            }
            var sizeKb = data.size_bytes ? Math.round(data.size_bytes / 1024) : 0;
            var apps = (data.apps && data.apps.length) ? data.apps.join(', ') : 'none';
            var msg = 'Backup created on ' + host + '.\nApps: ' + apps + '\nSize: ' + sizeKb + ' KB';
            if (data.paths_skipped && data.paths_skipped.length) {
                msg += '\nSkipped ' + data.paths_skipped.length + ' path(s).';
            }
            alert(msg);
            refreshOne(host);
        })
        .catch(function(err) { alert('Backup request failed: ' + err); });
}

function downloadBackup(host) {
    closeMenus();
    // Open in a new tab so the dashboard stays loaded, but JSON errors are still visible.

    var url = '/cgi-bin/backup-download.cgi?host=' + encodeURIComponent(host);

    var w = window.open(url, '_blank');

    if (!w) window.location.href = url;

}

function restartService(host, service) {
    if (!confirm('Restart ' + service + ' on ' + host + '?')) return;
    fetchJson('/cgi-bin/restart-service.cgi?host=' + encodeURIComponent(host) + '&service=' + encodeURIComponent(service))
        .then(function(data) {
            if (data.error) {
                alert('Error: ' + data.error);
            } else {
                alert(data.service + ': ' + data.result + (data.state ? ' (' + data.state + ')' : ''));
                refreshOne(host);
            }
        })
        .catch(function(err) {
            alert('Restart failed: ' + err);
        });
}

function modeSwitch(host, mode, btn) {
    var orig = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>';
    fetchJson('/cgi-bin/host-action.cgi?host=' + encodeURIComponent(host) + '&action=mode-switch&mode=' + encodeURIComponent(mode))
        .then(function(data) {
            if (data.error) { alert('Mode switch failed: ' + data.error); }
            else { setTimeout(function() { fetchAll(); }, 2000); }
        })
        .catch(function(err) { alert('Mode switch failed: ' + err); })
        .finally(function() { btn.disabled = false; btn.innerHTML = orig; });
}

function toggleCalendarPanel(host, btn) {
    var safeId = host.replace(/[^a-zA-Z0-9]/g, '-');
    var panelId = 'calendar-panel-' + safeId;
    var existing = document.getElementById(panelId);
    if (existing) { existing.remove(); return; }
    var actionsDiv = btn.parentNode;
    var panel = document.createElement('div');
    panel.id = panelId;
    panel.className = 'confirm-inline';
    panel.innerHTML =
        '<div class="cal-settings-grid">' +
        '<label>Theme<select id="cal-theme-' + safeId + '">' +
            '<option value="">No change</option>' +
            '<option value="classic-gold">Classic Gold</option>' +
            '<option value="modern-blue">Modern Blue</option>' +
            '<option value="elegant-black">Elegant Black</option>' +
            '<option value="liturgical-purple">Liturgical Purple</option>' +
            '<option value="festive-red">Festive Red</option>' +
            '<option value="light">Light Mode</option>' +
        '</select></label>' +
        '<label>Font<select id="cal-font-' + safeId + '">' +
            '<option value="">No change</option>' +
            '<option value="cinzel-lora">Cinzel + Lora</option>' +
            '<option value="roboto-open-sans">Roboto + Open Sans</option>' +
            '<option value="playfair-source">Nunito + Nunito Sans</option>' +
        '</select></label>' +
        '<label>Speed<select id="cal-speed-' + safeId + '">' +
            '<option value="">No change</option>' +
            '<option value="12">Normal (12s)</option>' +
            '<option value="18">Slow (18s)</option>' +
        '</select></label>' +
        '<label>Margins<select id="cal-margins-' + safeId + '">' +
            '<option value="">No change</option>' +
            '<option value="1">Large</option>' +
            '<option value="0">Normal</option>' +
        '</select></label>' +
        '</div>' +
        '<button onclick="applyCalendarSettings(\'' + escapeAttr(host) + '\')">Apply &amp; Show</button>' +
        ' <button onclick="document.getElementById(\'' + panelId + '\').remove()">Cancel</button>';
    actionsDiv.appendChild(panel);
}

function applyCalendarSettings(host) {
    var safeId = host.replace(/[^a-zA-Z0-9]/g, '-');
    var theme = document.getElementById('cal-theme-' + safeId).value;
    var font = document.getElementById('cal-font-' + safeId).value;
    var speed = document.getElementById('cal-speed-' + safeId).value;
    var margins = document.getElementById('cal-margins-' + safeId).value;

    if (!theme && !font && !speed && !margins) {
        alert('Select at least one setting to change.');
        return;
    }

    var params = 'host=' + encodeURIComponent(host) + '&action=calendar-settings';
    if (theme) params += '&theme=' + encodeURIComponent(theme);
    if (font) params += '&font=' + encodeURIComponent(font);
    if (speed) params += '&speed=' + encodeURIComponent(speed);
    if (margins) params += '&margins=' + encodeURIComponent(margins);

    var panelId = 'calendar-panel-' + safeId;
    var panel = document.getElementById(panelId);
    if (panel) panel.innerHTML = '<span class="spinner"></span> Applying&hellip;';

    fetchJson('/cgi-bin/host-action.cgi?' + params)
        .then(function(data) {
            var current = document.getElementById(panelId);
            if (data.error) {
                alert('Calendar settings failed: ' + data.error);
                if (current) current.remove();
            } else {
                if (current) current.remove();
                setTimeout(function() { fetchAll(); }, 2000);
            }
        })
        .catch(function(err) {
            alert('Calendar settings failed: ' + err);
            var current = document.getElementById(panelId);
            if (current) current.remove();
        });
}

function toggleImagesPanel(host, btn) {
    var panel = document.getElementById('images-panel-' + safeId(host));
    if (!panel) return;
    if (panel.style.display !== 'none' && panel.style.display !== '') {
        panel.style.display = 'none';
        return;
    }
    panel.style.display = 'block';
    loadImagesPanel(host);
}

function loadImagesPanel(host) {
    var panel = document.getElementById('images-panel-' + safeId(host));
    if (!panel) return;
    panel.innerHTML = '<span class="spinner"></span> Loading images&hellip;';

    fetchJson('/cgi-bin/fetch-calendar-images.cgi?host=' + encodeURIComponent(host))
        .then(function(data) {
            if (data.error) {
                panel.innerHTML = '<small>&#9888; ' + escapeHtml(data.error) + '</small>';
                return;
            }
            renderImagesPanel(host, data, panel);
        })
        .catch(function(err) {
            panel.innerHTML = '<small>&#9888; Failed to load images: ' + escapeHtml(String(err)) + '</small>';
        });
}

function renderImagesPanel(host, data, panel) {
    var id = safeId(host);
    var images = data.images || [];

    var html = '';
    if (hasRole('contributor')) {
        html += '<div class="images-upload">';
        html += '<label>Remove after date<input type="date" id="img-upload-date-' + id + '"></label>';
        html += '<label>&nbsp;<input type="file" id="img-upload-file-' + id + '" accept="image/*"></label>';
        html += '<button onclick="uploadCalendarImage(\'' + escapeAttr(host) + '\')">&#11014; Upload</button>';
        html += '</div>';
        html += '<div id="img-upload-status-' + id + '"></div>';
    }

    if (data.stale > 0) {
        html += '<div class="cal-info-warn">&#9888; ' + data.stale + ' of ' + data.total + ' image(s) are past their removal date.</div>';
    }

    if (!images.length) {
        html += '<div class="stale">No images found.</div>';
    } else {
        html += '<div class="img-grid">';
        images.forEach(function(img) {
            html += '<div class="img-tile' + (img.stale ? ' stale' : '') + '">';
            if (img.thumbnail) {
                html += '<img src="' + img.thumbnail + '" alt="" onclick="viewCalendarImage(\'' + escapeAttr(host) + '\',\'' + escapeAttr(img.filename) + '\')">';
            } else {
                html += '<div class="img-noThumb" onclick="viewCalendarImage(\'' + escapeAttr(host) + '\',\'' + escapeAttr(img.filename) + '\')">&#128444;</div>';
            }
            html += '<div class="img-name" title="' + escapeAttr(img.filename) + '">' + escapeHtml(img.filename) + '</div>';
            if (img.stale) html += '<span class="badge badge-warn">stale</span>';
            if (hasRole('contributor')) {
                html += '<div style="display:flex;gap:3px;justify-content:center;margin-top:3px">';
                html += '<button class="btn-danger" style="font-size:10px;padding:2px 5px" onclick="archiveCalendarImageUI(\'' + escapeAttr(host) + '\',\'' + escapeAttr(img.filename) + '\')">Archive</button>';
                html += '<button style="font-size:10px;padding:2px 5px" onclick="storeEvergreenImageUI(\'' + escapeAttr(host) + '\',\'' + escapeAttr(img.filename) + '\')">To Evergreen</button>';
                html += '</div>';
            }
            html += '</div>';
        });
        html += '</div>';
    }

    html += '<div style="margin-top:8px;display:flex;gap:8px">';
    html += '<button onclick="toggleArchivePanel(\'' + escapeAttr(host) + '\')">&#128193; View Archive</button>';
    html += '<button onclick="toggleEvergreenPanel(\'' + escapeAttr(host) + '\')">&#127794; View Evergreen</button>';
    html += '</div>';
    html += '<div class="images-panel" id="archive-panel-' + id + '" style="display:none;margin-top:6px"></div>';
    html += '<div class="images-panel" id="evergreen-panel-' + id + '" style="display:none;margin-top:6px"></div>';

    panel.innerHTML = html;
}

function toggleArchivePanel(host) {
    var panel = document.getElementById('archive-panel-' + safeId(host));
    if (!panel) return;
    if (panel.style.display === 'block') {
        panel.style.display = 'none';
        return;
    }
    panel.style.display = 'block';
    loadArchivePanel(host);
}

    fetchJson('/cgi-bin/fetch-archived-calendar-images.cgi?host=' + encodeURIComponent(host))

                panel.innerHTML = '<small>&#9888; ' + escapeHtml(data.error) + '</small>';
                return;

        })

function renderArchivePanel(host, data, panel) {

        html += '<div class="img-grid">';

            if (hasRole('contributor')) {

            }

function restoreCalendarImageUI(host, filename) {
    fetchJson('/cgi-bin/restore-calendar-image.cgi?host=' + encodeURIComponent(host) + '&filename=' + encodeURIComponent(filename))
        .then(function(data) {

            loadArchivePanel(host);
            loadImagesPanel(host);
            setTimeout(function() { refreshOne(host); }, 1000);

        .catch(function(err) { alert('Restore failed: ' + err); });
}

function storeEvergreenImageUI(host, filename) {
    if (!confirm('Move "' + filename + '" to evergreen storage? It will be removed from the live calendar but can be activated again at any time.')) return;
    fetchJson('/cgi-bin/store-evergreen-image.cgi?host=' + encodeURIComponent(host) + '&filename=' + encodeURIComponent(filename))

function activateEvergreenImageUI(host, filename) {

        .then(function(data) {

function viewCalendarImage(host, filename) {
    var url = '/cgi-bin/fetch-calendar-image-file.cgi?host=' + encodeURIComponent(host) + '&filename=' + encodeURIComponent(filename);
    window.open(url, '_blank');
}

function uploadCalendarImage(host) {
    var id = safeId(host);
    var dateInput = document.getElementById('img-upload-date-' + id);
    var fileInput = document.getElementById('img-upload-file-' + id);
    var statusEl = document.getElementById('img-upload-status-' + id);

    var removeDate = dateInput ? dateInput.value : '';
    var file = fileInput && fileInput.files ? fileInput.files[0] : null;

    if (!removeDate) { alert('Choose the date this image should be removed from the calendar.'); return; }
    if (!file) { alert('Choose an image file to upload.'); return; }

    var ext = (file.name.match(/\.[^.]+$/) || [''])[0].toLowerCase();
    if (!/^\.(jpe?g|png|gif|webp)$/.test(ext)) {
        alert('Unsupported file type. Use jpg, jpeg, png, gif, or webp.');
        return;
    }

    var baseName = file.name.replace(/\.[^.]+$/, '').replace(/[^a-zA-Z0-9 _-]/g, '').trim();
    if (!baseName) baseName = 'image';
    var filename = removeDate + ' ' + baseName + ext;

    if (statusEl) statusEl.innerHTML = '<span class="spinner"></span> Uploading&hellip;';

    var reader = new FileReader();
    reader.onload = function() {
        var dataUrl = reader.result;
        var base64 = dataUrl.substring(dataUrl.indexOf(',') + 1);

        fetch('/cgi-bin/upload-calendar-image.cgi?host=' + encodeURIComponent(host), {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({filename: filename, data_base64: base64})
        })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (data.error || data.result === 'failed') {
                    if (statusEl) statusEl.innerHTML = '<small>&#9888; ' + escapeHtml(data.error || 'Upload failed') + '</small>';
                    return;
                }
                if (statusEl) statusEl.innerHTML = '';
                loadImagesPanel(host);
                setTimeout(function() { refreshOne(host); }, 1000);
            })
            .catch(function(err) {
                if (statusEl) statusEl.innerHTML = '<small>&#9888; Upload failed: ' + escapeHtml(String(err)) + '</small>';
            });
    };
    reader.onerror = function() {
        if (statusEl) statusEl.innerHTML = '<small>&#9888; Failed to read file</small>';
    };
    reader.readAsDataURL(file);
}

function archiveCalendarImageUI(host, filename) {
    if (!confirm('Archive "' + filename + '"? It will be removed from the live calendar but can be restored later.')) return;
    fetchJson('/cgi-bin/archive-calendar-image.cgi?host=' + encodeURIComponent(host) + '&filename=' + encodeURIComponent(filename))
        .then(function(data) {
            if (data.error || data.result === 'failed') {
                alert('Archive failed: ' + (data.error || 'unknown error'));
                return;
            }
            loadImagesPanel(host);
            setTimeout(function() { refreshOne(host); }, 1000);
        })
        .catch(function(err) { alert('Archive failed: ' + err); });
}

function rebootHost(host, btn) {
    var confirmId = 'reboot-confirm-' + host.replace(/[^a-zA-Z0-9]/g, '-');
    var existing = document.getElementById(confirmId);
    if (existing) { existing.remove(); return; }
    var actionsDiv = btn.parentNode;
    var panel = document.createElement('div');
    panel.id = confirmId;
    panel.className = 'confirm-inline';
    panel.innerHTML =
        '&#9888; Reboot <b>' + escapeHtml(host) + '</b>? ' +
        '<button onclick="doReboot(\'' + escapeAttr(host) + '\')" style="background:#8b1010;border-color:#a01515">Confirm</button>' +
        ' <button onclick="document.getElementById(\'' + confirmId + '\').remove()">Cancel</button>';
    actionsDiv.appendChild(panel);
    setTimeout(function() { var p = document.getElementById(confirmId); if (p) p.remove(); }, 15000);
}

function doReboot(host) {
    var confirmId = 'reboot-confirm-' + host.replace(/[^a-zA-Z0-9]/g, '-');
    var panel = document.getElementById(confirmId);
    if (panel) panel.innerHTML = '<span class="spinner"></span> Rebooting&hellip;';
    fetchJson('/cgi-bin/host-action.cgi?host=' + encodeURIComponent(host) + '&action=reboot')
        .then(function(data) {
            if (data.error) {
                if (panel) panel.remove();
                alert('Reboot failed: ' + data.error);
            } else {
                if (panel) panel.innerHTML = '&#x2713; Rebooting &mdash; reconnecting in 20s&hellip;';
                setTimeout(function() { if (panel) panel.remove(); fetchAll(); }, 20000);
            }
        })
        .catch(function(err) {
            if (panel) panel.remove();
            alert('Reboot request failed: ' + err);
        });
}

function fetchJson(url) {
    return fetch(url).then(function(r) {
        return r.text().then(function(text) {
            try {
                return JSON.parse(text);
            } catch (e) {
                var snippet = text.replace(/\s+/g, ' ').slice(0, 140);
                throw new Error('HTTP ' + r.status + ' non-JSON response: ' + snippet);
            }
        });
    });
}

// Initial fetch — gated behind a valid login session; checkAuth() redirects
// to login.html if the whoami.cgi check comes back 401.
checkAuth().then(function() {
    fetchAll();
    cecTimerInterval = setInterval(updateCecTimers, 1000);

    // Auto-refresh
    resetAutoRefresh();
});

function resetAutoRefresh() {
    if (autoTimer) clearInterval(autoTimer);
    var cb = document.getElementById('autoRefresh');
    if (cb && cb.checked) {
        autoTimer = setInterval(fetchAll, 60000);
    }
}
document.getElementById('autoRefresh').addEventListener('change', resetAutoRefresh);
