<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Church Monitoring</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,system-ui,sans-serif;background:#1a1a2e;color:#e0e0e0;padding:16px}
h1{font-size:20px;margin-bottom:12px;color:#fff;display:flex;align-items:center;gap:8px}
h1 a{font-size:13px;color:#7eb8da;text-decoration:none;margin-left:auto}
h1 a:hover{text-decoration:underline}
.cards{display:flex;flex-wrap:wrap;gap:14px}
.card{background:#16213e;border-radius:8px;padding:14px;min-width:320px;flex:1;border:1px solid #0f3460}
.card.error{border-color:#c0392b}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.card-name{font-size:16px;font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.dot.ok{background:#27ae60}
.dot.warn{background:#f39c12}
.dot.err{background:#c0392b}
.dot.unk{background:#7f8c8d}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px;margin-bottom:10px;font-size:12px;color:#a0a0c0}
.metrics span{background:#0f3460;border-radius:4px;padding:4px 6px;text-align:center}
.metrics .val{color:#fff;font-weight:600;display:block;font-size:14px}
table{width:100%;font-size:13px;border-collapse:collapse;margin-bottom:8px}
th{text-align:left;color:#7eb8da;padding:3px 6px;border-bottom:1px solid #0f3460;font-weight:500}
td{padding:3px 6px}
.s-active,.s-running{color:#27ae60}
.s-inactive,.s-not{color:#c0392b}
.s-unknown{color:#7f8c8d}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
button{background:#0f3460;color:#e0e0e0;border:1px solid #1a4a7a;border-radius:4px;padding:4px 10px;cursor:pointer;font-size:12px}
button:hover{background:#1a4a7a}
button:disabled{opacity:0.5;cursor:default}
.stale{font-size:11px;color:#7f8c8d}
.cec-result{font-size:12px;margin-top:6px;padding:6px;background:#0f3460;border-radius:4px;display:none}
.spinner{display:inline-block;width:12px;height:12px;border:2px solid #7f8c8d;border-top-color:#7eb8da;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-msg{text-align:center;padding:40px;color:#7f8c8d;font-size:14px}
.refresh-bar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.auto-label{font-size:11px;color:#7f8c8d}
</style>
</head>
<body>

<h1>&#128225; Church Monitoring <a href="help.html">Help</a></h1>

<div class="refresh-bar">
    <button onclick="fetchAll()">&#x21bb; Refresh All</button>
    <label class="auto-label"><input type="checkbox" id="autoRefresh" checked> Auto-refresh 60s</label>
    <span class="stale" id="lastUpdate"></span>
</div>

<div class="cards" id="cards">
    <div class="loading-msg"><span class="spinner"></span> Loading status&hellip;</div>
</div>

<script>
var autoTimer = null;
var cecCache = {};  // Persistent CEC results keyed by client name
var cecTimerInterval = null;

function formatUptime(s) {
    if (!s && s !== 0) return '—';
    var d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600),
        m = Math.floor((s % 3600) / 60);
    var parts = [];
    if (d) parts.push(d + 'd');
    if (h) parts.push(h + 'h');
    parts.push(m + 'm');
    return parts.join(' ');
}

function ago(ts) {
    if (!ts) return 'never';
    var diff = Math.floor((Date.now() - new Date(ts).getTime()) / 1000);
    if (diff < 60) return diff + 's ago';
    if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
    return Math.floor(diff / 3600) + 'h ago';
}

function statusClass(s) {
    if (!s) return 's-unknown';
    if (s === 'active' || s.indexOf('running') === 0) return 's-active';
    if (s === 'inactive' || s === 'not running') return 's-inactive';
    return 's-unknown';
}

function hostHealth(data) {
    if (data.error) return 'err';
    var svcs = data.services || [];
    var bad = false;

    // Identify mutual-exclusion pair: vlc and midori
    var vlcSvc = null, midoriSvc = null;
    svcs.forEach(function(svc) {
        if (svc.name === 'vlc') vlcSvc = svc;
        if (svc.name === 'midori') midoriSvc = svc;
    });

    var vlcUp = vlcSvc && vlcSvc.status && vlcSvc.status.indexOf('running') === 0;
    var midoriUp = midoriSvc && midoriSvc.status && midoriSvc.status.indexOf('running') === 0;
    var hasPair = vlcSvc && midoriSvc;

    // Both running = caution
    if (hasPair && vlcUp && midoriUp) return 'warn';

    // Check all services, but skip the expected-down member of the pair
    svcs.forEach(function(svc) {
        if (svc.status === 'inactive' || svc.status === 'not running') {
            // If this is the idle member of the vlc/midori pair, it's expected
            if (hasPair && ((svc.name === 'midori' && vlcUp) || (svc.name === 'vlc' && midoriUp))) return;
            bad = true;
        }
    });

    // Neither running when both are monitored = bad
    if (hasPair && !vlcUp && !midoriUp) bad = true;

    return bad ? 'warn' : 'ok';
}

function renderCard(data) {
    var name = data.client_name || data.hostname || 'unknown';
    var health = hostHealth(data);

    if (data.error && !data.services) {
        return '<div class="card error"><div class="card-head"><span class="card-name">' +
            name + '</span><span class="dot err"></span></div>' +
            '<div style="color:#c0392b;font-size:13px;">' + escapeHtml(data.error) + '</div></div>';
    }

    var html = '<div class="card"><div class="card-head"><span class="card-name">' +
        escapeHtml(name) + '</span><span class="dot ' + health + '"></span></div>';

    // Metrics
    html += '<div class="metrics">';
    html += '<span>Uptime<span class="val">' + formatUptime(data.uptime_seconds) + '</span></span>';
    if (data.load) html += '<span>CPU Load<span class="val">' + data.load.avg_1 + '</span></span>';
    if (data.memory) html += '<span>Memory<span class="val">' + data.memory.used_mb + '/' + data.memory.total_mb + ' MB</span></span>';
    if (data.disk) html += '<span>Disk<span class="val">' + Math.round(data.disk.used_mb / 1024 * 10) / 10 + '/' + Math.round(data.disk.total_mb / 1024 * 10) / 10 + ' GB</span></span>';
    if (data.temperature_c !== null && data.temperature_c !== undefined) html += '<span>Temp<span class="val">' + data.temperature_c + '&deg;C</span></span>';
    html += '</div>';

    // Services table
    if (data.services && data.services.length) {
        html += '<table><tr><th>Service</th><th>Type</th><th>Status</th></tr>';
        data.services.forEach(function(svc) {
            html += '<tr><td>' + escapeHtml(svc.name) + '</td><td>' + svc.type +
                '</td><td class="' + statusClass(svc.status) + '">' + escapeHtml(svc.status) + '</td></tr>';
        });
        html += '</table>';
    }

    // Actions
    html += '<div class="actions">';
    html += '<button onclick="refreshOne(\'' + escapeAttr(name) + '\')">&#x21bb; Refresh</button>';
    if (data.cec_enabled) {
        html += '<button onclick="checkCec(\'' + escapeAttr(name) + '\')">&#128250; Check TV</button>';
        html += '<button onclick="cecControl(\'' + escapeAttr(name) + '\',\'on\')">&#9654; TV On</button>';
        html += '<button onclick="cecControl(\'' + escapeAttr(name) + '\',\'standby\')">&#9724; Standby</button>';
        html += '<button onclick="cecControl(\'' + escapeAttr(name) + '\',\'active\')">&#127909; Set Active</button>';
    }
    html += '<span class="stale">Cached ' + ago(data.timestamp) + '</span>';
    html += '</div>';

    // CEC result area
    if (data.cec_enabled) {
        var cached = cecCache[name];
        var cecDisplay = cached ? 'display:block' : 'display:none';
        var cecContent = cached ? renderCecResult(cached) : '';
        html += '<div class="cec-result" id="cec-' + escapeAttr(name) + '" style="' + cecDisplay + '">' + cecContent + '</div>';
    }

    html += '</div>';
    return html;
}

function escapeHtml(s) {
    if (!s) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function escapeAttr(s) {
    return String(s).replace(/'/g, "\\'").replace(/"/g, '\\"');
}

function renderCecResult(cached) {
    var power = cached.tv_power || 'unknown';
    var input = cached.hdmi_input || 'unknown';
    var color = power === 'on' ? '#27ae60' : power === 'standby' ? '#f39c12' : '#7f8c8d';
    return '<span style="color:' + color + '">&#9679;</span> TV: <b>' + escapeHtml(power) +
        '</b> &nbsp; HDMI: <b>' + escapeHtml(input) + '</b> &nbsp; ' +
        '<span class="cec-ago" data-ts="' + cached.fetchedAt + '">' + ago(new Date(cached.fetchedAt).toISOString()) + '</span>';
}

function updateCecTimers() {
    var els = document.querySelectorAll('.cec-ago');
    els.forEach(function(el) {
        var ts = parseInt(el.getAttribute('data-ts'), 10);
        if (!ts) return;
        var diff = Math.floor((Date.now() - ts) / 1000);
        if (diff < 60) el.textContent = diff + 's ago';
        else if (diff < 3600) el.textContent = Math.floor(diff / 60) + 'm ' + (diff % 60) + 's ago';
        else el.textContent = Math.floor(diff / 3600) + 'h ' + Math.floor((diff % 3600) / 60) + 'm ago';
    });
}

function fetchAll() {
    var cards = document.getElementById('cards');
    fetch('/cgi-bin/fetch-status.cgi')
        .then(function(r) { return r.json(); })
        .then(function(data) {
            if (!Array.isArray(data)) {
                cards.innerHTML = '<div class="loading-msg" style="color:#c0392b;">Error: ' + escapeHtml(data.error || 'unexpected response') + '</div>';
                return;
            }
            if (data.length === 0) {
                cards.innerHTML = '<div class="loading-msg">No clients enrolled yet.<br><br>Run <code>sudo ./install-client.sh</code> on a host to add it.</div>';
                return;
            }
            var html = '';
            data.forEach(function(d) { html += renderCard(d); });
            cards.innerHTML = html;
            document.getElementById('lastUpdate').textContent = 'Updated ' + new Date().toLocaleTimeString();
        })
        .catch(function(err) {
            cards.innerHTML = '<div class="loading-msg" style="color:#c0392b;">Failed to fetch status: ' + escapeHtml(String(err)) + '</div>';
        });
}

function refreshOne(name) {
    // Currently re-fetches all — could be optimized to single-client endpoint
    fetchAll();
}

function checkCec(name) {
    var el = document.getElementById('cec-' + name);
    if (!el) return;
    el.style.display = 'block';
    el.innerHTML = '<span class="spinner"></span> Querying CEC (may take a few seconds)&hellip;';

    fetch('/cgi-bin/fetch-cec.cgi?host=' + encodeURIComponent(name))
        .then(function(r) { return r.json(); })
        .then(function(data) {
            if (data.error) {
                el.innerHTML = '&#9888; ' + escapeHtml(data.error);
                delete cecCache[name];
                return;
            }
            data.fetchedAt = Date.now();
            cecCache[name] = data;
            el.innerHTML = renderCecResult(data);
        })
        .catch(function(err) {
            el.innerHTML = '&#9888; CEC check failed: ' + escapeHtml(String(err));
            delete cecCache[name];
        });
}

function cecControl(name, action) {
    var el = document.getElementById('cec-' + name);
    if (!el) return;
    el.style.display = 'block';
    var labels = {on:'Turning TV on',standby:'Putting TV in standby',active:'Setting active input'};
    el.innerHTML = '<span class="spinner"></span> ' + (labels[action] || action) + '&hellip;';

    fetch('/cgi-bin/cec-control.cgi?host=' + encodeURIComponent(name) + '&action=' + encodeURIComponent(action))
        .then(function(r) { return r.json(); })
        .then(function(data) {
            if (data.error) {
                el.innerHTML = '&#9888; ' + escapeHtml(data.error);
                return;
            }
            var color = data.result === 'on' ? '#27ae60' : data.result === 'standby' ? '#f39c12' : '#7eb8da';
            el.innerHTML = '<span style="color:' + color + '">&#9679;</span> ' +
                escapeHtml(action) + ': <b>' + escapeHtml(data.result) + '</b> &nbsp; ' +
                '<span class="cec-ago" data-ts="' + Date.now() + '">0s ago</span>';
        })
        .catch(function(err) {
            el.innerHTML = '&#9888; CEC control failed: ' + escapeHtml(String(err));
        });
}

// Initial fetch
fetchAll();
cecTimerInterval = setInterval(updateCecTimers, 1000);

// Auto-refresh
function resetAutoRefresh() {
    if (autoTimer) clearInterval(autoTimer);
    var cb = document.getElementById('autoRefresh');
    if (cb && cb.checked) {
        autoTimer = setInterval(fetchAll, 60000);
    }
}
document.getElementById('autoRefresh').addEventListener('change', resetAutoRefresh);
resetAutoRefresh();
</script>

</body>
</html>
